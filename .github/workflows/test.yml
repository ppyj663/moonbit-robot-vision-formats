name: Check and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: install-ubuntu
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: install-windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: install and update stable toolchain
        run: |
          moon version --all
          moon update
      - name: require MoonBit 0.10.9 or newer (unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          raw="$(moonc --version)"
          if [[ "$raw" =~ moonc\ v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Unable to parse compiler version: $raw" >&2
            exit 1
          fi
          if (( major < 0 || (major == 0 && minor < 10) || (major == 0 && minor == 10 && patch < 9) )); then
            echo "MoonBit compiler >= 0.10.9 is required; found $raw" >&2
            exit 1
          fi
      - name: require MoonBit 0.10.9 or newer (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $raw = & moonc --version
          if ($raw -notmatch 'moonc v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)') {
            throw "Unable to parse compiler version: $raw"
          }
          $actual = [version]("$($Matches.major).$($Matches.minor).$($Matches.patch)")
          if ($actual -lt [version]'0.10.9') {
            throw "MoonBit compiler >= 0.10.9 is required; found $raw"
          }
      - name: moon check
        run: moon check --target all --deny-warn
      - name: moon test
        run: moon test --target all --deny-warn
      - name: moon fmt
        run: moon fmt --check
      - name: moon info
        run: |
          moon info
          git diff --exit-code
      - name: native boundary suite
        run: moon test --target native
