name: Publish Mooncakes package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install stable MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify stable MoonBit toolchain
        shell: bash
        run: |
          moon version --all
          moon update
          raw="$(moonc -v)"
          if [[ "$raw" =~ v([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Unable to parse compiler version: $raw" >&2
            exit 1
          fi
          if (( major < 0 || (major == 0 && minor < 10) || (major == 0 && minor == 10 && patch < 9) )); then
            echo "MoonBit compiler >= 0.10.9 is required; found $raw" >&2
            exit 1
          fi
      - name: Pre-publish validation
        run: |
          moon check --target all --deny-warn
          moon test --target all --deny-warn
          moon fmt --check
          moon info
          git diff --exit-code
      - name: Publish to Mooncakes
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: |
          test -n "$MOONCAKES_TOKEN"
          mkdir -p "$HOME/.moon"
          printf '%s' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          moon publish
          rm -f "$HOME/.moon/credentials.json"
